<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Función no disponible en tu plan</title>

        body { font-family: system-ui, sans-serif; background:#f9fafb; display:flex; align-items:center; justify-content:center; height:100vh; margin:0; }
        .caja { text-align:center; max-width:420px; padding:2rem; background:white; border-radius:8px; box-shadow:0 1px 3px rgba(0,0,0,.1); }
        h1 { color:#d97706; font-size:1.3rem; }
        p { color:#6b7280; }
    </style>
</head>
<body>
    <div class="caja">
        <h1>Función no incluida en tu plan actual</h1>

    </div>
</body>
</html>
