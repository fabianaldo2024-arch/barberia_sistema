services:
  services:
  # Servicio web: sirve el sitio Django
  - type: web
    name: barberia-web
    runtime: python
    plan: free
    buildCommand: "poetry install --no-root && poetry run python manage.py collectstatic --noinput && poetry run python manage.py migrate"
    startCommand: "poetry run gunicorn core.wsgi:application"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "barberia-web.onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: barberia-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: barberia-redis
          property: connectionString

  # Redis: queda gratis y listo para cuando actives el worker de Celery
  - type: redis
    name: barberia-redis
    plan: free
    ipAllowList: []

  # Worker de Celery: procesa las tareas en segundo plano (recordatorios)
  - type: worker
    name: barberia-worker
    runtime: python
    buildCommand: "poetry install --no-root"
    startCommand: "poetry run celery -A core worker --loglevel=info"
    envVars:
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: barberia-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: barberia-redis
          property: connectionString

  # Redis: el "mensajero" entre la web y el worker de Celery
  - type: redis
    name: barberia-redis
    plan: free
    ipAllowList: []

databases:
  # Base de datos PostgreSQL, reemplaza tu SQLite local
  - name: barberia-db
    plan: free
