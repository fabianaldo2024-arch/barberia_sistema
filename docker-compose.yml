services:
  redis:
    image: redis:7-alpine
    container_name: barberia_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  web:
    build: .
    container_name: barberia_web
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Tu settings.py lee REDIS_URL y deriva CELERY_BROKER_URL/RESULT_BACKEND
      # de ahí. Sobreescribimos esta variable del .env para que apunte al
      # contenedor de redis (nombre del servicio), no a localhost.
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy

  celery_worker:
    build: .
    container_name: barberia_celery_worker
    command: celery -A core worker -l info
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy

  # Tienes django_celery_beat instalado, así que probablemente quieras
  # tareas periódicas. Descomenta este servicio si las usas.
  # celery_beat:
  #   build: .
  #   container_name: barberia_celery_beat
  #   command: celery -A core beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
  #   volumes:
  #     - .:/app
  #   env_file:
  #     - .env
  #   environment:
  #     - REDIS_URL=redis://redis:6379/0
  #   depends_on:
  #     redis:
  #       condition: service_healthy

volumes:
  redis_data: