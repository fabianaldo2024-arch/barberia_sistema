{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barbería Sistema</title>
    <!-- Bootstrap CSS para interfaz moderna y responsive [1] -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .navbar-brand img {
            max-height: 50px; /* Tamaño del logo en la barra de navegación */
        }
        body { background-color: #f8f9fa; }
        .navbar-dark { background-color: #1a1a1a !important; }
    </style>
</head>
<body>

    <!-- Barra de navegación global con el Logo corporativo -->
    <nav class="navbar navbar-expand-lg navbar-dark mb-4 shadow">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="{% url 'solicitar_turno' %}">
                <!-- Whitenoise sirve este archivo en producción [2] -->
                <img src="{% static 'img/logo_barberia.png' %}" alt="Logo Barbería">
                <span class="ms-3 fw-bold">GESTIÓN DE TURNOS</span>
            </a>
            <!-- Aquí podrías añadir enlaces al Panel de Control si el usuario está autenticado [3] -->
        </div>
    </nav>

    <!-- Espacio donde se inyectará el contenido de cada página -->
    <div class="container">
        {% block content %}
        <!-- Aquí aparecerán los formularios o tablas de la recepcionista [3, 4] -->
        {% endblock %}
    </div>

    <!-- Scripts de Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
