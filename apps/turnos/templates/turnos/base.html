{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barbería Sistema</title>
    <!-- Bootstrap CSS para interfaz moderna y responsive [1] -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .navbar-brand img {
            max-height: 50px; /* Ajusta el tamaño del logo en la barra de navegación */
        }
        body { background-color: #f8f9fa; }
    </style>
</head>
<body>

    <!-- Barra de navegación con el Logo -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="{% url 'solicitar_turno' %}">
                <!-- El logo se carga desde la carpeta static gracias a Whitenoise [2] -->
                <img src="{% static 'img/logo_barberia.png' %}" alt="Logo Barbería" class="d-inline-block align-text-top">
                <span class="ms-2">Gestión de Turnos</span>
            </a>
        </div>
    </nav>

    <!-- Contenido principal dinámico -->
    <div class="container">
        {% block content %}
        <!-- Aquí se inyectará automáticamente el formulario de reserva o el panel [3, 4] -->
        {% endblock %}
    </div>

    <!-- Scripts de Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
