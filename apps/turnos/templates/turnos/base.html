{% load static %}
<!DOCTYPE html>
<html lang="es" data-bs-theme="dark"> <!-- Cambia 'light' por 'dark' -->
<head>
      <meta charset="UTF-8">
    <title>Reserva tu Turno - Modo Oscuro</title>
    <!-- Asegúrate de tener el link a Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <!-- Barra de navegación global con el Logo corporativo -->
    <nav class="navbar navbar-expand-lg navbar-dark mb-4 shadow">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="{% url 'solicitar_turno' %}">
                <!-- Whitenoise sirve este archivo en producción [2] -->
                <img src="{% static 'img/logo_barberia.png' %}" alt="Logo Barbería">
                <span class="ms-3 fw-bold">GESTIÓN DE TURNOS</span>
            </a>
            <!-- Aquí podrías añadir enlaces al Panel de Control si el usuario está autenticado [3] -->
        </div>
    </nav>

    <!-- Espacio donde se inyectará el contenido de cada página -->
    <div class="container">
        {% block content %}
        <!-- Aquí aparecerán los formularios o tablas de la recepcionista [3, 4] -->
        {% endblock %}
    </div>

    <!-- Scripts de Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
