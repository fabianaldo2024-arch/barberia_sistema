<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baja Confirmada - Barbería</title>
    <!-- Importación de Bootstrap para mantener consistencia visual -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .confirmation-container { max-width: 500px; margin: 100px auto; text-align: center; background: white; padding: 40px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .icon-box { font-size: 50px; color: #198754; margin-bottom: 20px; }
    </style>
</head>
<body>

<div class="container">
    <div class="confirmation-container">
        <div class="icon-box">
            <i class="bi bi-check-circle-fill"></i>
            <!-- Usamos un check simple si no tienes iconos de Bootstrap instalados -->
            <span style="color: #28a745;">✔</span>
        </div>
        <h2 class="mb-3">Suscripción Cancelada</h2>
        <p class="text-muted mb-4">
            Tu número ha sido eliminado de nuestra lista de difusión de promociones. 
            No recibirás más mensajes publicitarios por WhatsApp o SMS.
        </p>
        <hr>
        <p class="small text-secondary">
            Si deseas volver a recibir novedades en el futuro, podrás solicitarlo en tu próxima reserva de turno.
        </p>
        <div class="d-grid gap-2 mt-4">
            <a href="{% url 'solicitar_turno' %}" class="btn btn-dark">Volver al Inicio</a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
