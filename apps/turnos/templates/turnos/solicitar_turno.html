{% load static %}
<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Turnos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* CSS para arreglar el tamaño del logo */
        .logo-barberia {
            max-height: 150px; /* Ajusta este valor para que el logo no sea gigante */
            width: auto;
            display: block;
        }
        
        .header-container {
            padding: 20px 0;
            border-bottom: 1px solid #333;
            margin-bottom: 30px;
        }
    </style>
</head>
<body class="bg-dark text-light">

<div class="container">
    <!-- SECCIÓN DEL LOGO Y TÍTULO ARREGLADA -->
    <div class="col-md-4 d-flex justify-content-center justify-content-md-start">
    <!-- 
    IMPORTANTE: Verifica que tu imagen esté en: 
    static/img/tu_logo.png (o el nombre que tenga tu archivo)
    -->
    <img src="{% static 'img/logo_barberia.png' %}" 
         alt="Logo PM" 
         class="img-fluid" 
         style="max-height: 100px; width: auto;">
</div>

    <!-- SECCIÓN DEBAJO DEL LOGO (Donde estaba el comentario en la imagen) -->
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card p-4 border-secondary shadow">
                <h2 class="text-center mb-4">Reserva tu Turno</h2>
                
                <form method="post">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label class="form-label">Cliente nombre:</label>
                        {{ form.cliente_nombre }}
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Cliente celular:</label>
                        {{ form.cliente_celular }}
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Barbero:</label>
                        {{ form.barbero }}
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Fecha hora:</label>
                        {{ form.fecha_hora }}
                        <div class="form-text text-secondary">Formato: DD/MM/YYYY HH:MM</div>
                    </div>

                    <div class="mb-3 form-check">
                        {{ form.acepta_promociones }}
                        <label class="form-check-label">Acepta recibir promociones y novedades</label>
                    </div>

                    <div class="text-center mt-4">
                        <button type="submit" class="btn btn-outline-light px-5 py-2">
                            Confirmar mi Turno
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
