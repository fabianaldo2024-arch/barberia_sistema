{% extends "base.html" %} <!-- O usa la estructura de Bootstrap que ya tienes -->
{% block content %}
<div class="container mt-5">
    <div class="card shadow">
        <div class="card-header bg-dark text-white">
            <h3>Panel de Promociones Masivas</h3>
        </div>
        <div class="card-body">
            {% if mensaje_estado %}
                <div class="alert alert-success">{{ mensaje_estado }}</div>
            {% endif %}
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label">Redactar Promoción</label>
                    <textarea name="mensaje" class="form-control" rows="4" placeholder="Ej: ¡2x1 en corte de barba este martes!"></textarea>
                </div>
                <button type="submit" class="btn btn-primary w-100">Enviar a clientes con consentimiento</button>
            </form>
            <p class="text-muted mt-3 small">* El envío se procesa de forma asíncrona vía Celery para no afectar el rendimiento.</p>
        </div>
    </div>
</div>
{% endblock %}
