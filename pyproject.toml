[tool.poetry]
name = "barberia-sistema"
version = "0.1.0"
description = "Sistema de gestión de turnos y recordatorios automáticos"
authors = ["Tu Nombre <tu@email.com>"]

[tool.poetry.dependencies]
python = "^3.10"
django = "^5.0"
celery = "^5.3"
redis = "^5.0"
twilio = "^9.0"
python-dotenv = "^1.0"
whitenoise = "^6.6"
django-celery-beat = "^2.9.0"
django-import-export = "^4.4.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"